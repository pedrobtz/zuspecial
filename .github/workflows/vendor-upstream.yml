# Opens an issue when SciPy releases a version newer than the one whose xsf
# pin is vendored. The pin follows SciPy releases (design section 8).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: vendor-upstream

jobs:
  upstream:
    uses: pedrobtz/r-actions/.github/workflows/vendor-upstream.yml@v1
    permissions:
      contents: read
      issues: write
    with:
      upstream-repo: scipy/scipy
      current-version: awk -F'\t' '$1 == "xsf" { print $4 }' tools/vendor/manifest.tsv
      tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
